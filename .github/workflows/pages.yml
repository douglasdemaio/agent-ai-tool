name: Build and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/live-*.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: Verify
        run: make vet test
      - name: Generate
        # No VTESSERA_BASE_URL secret is configured yet, so the live section
        # renders from the committed snapshot or stays absent. That is
        # deliberate: the site must publish whether or not vtessera is up.
        run: make generate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
