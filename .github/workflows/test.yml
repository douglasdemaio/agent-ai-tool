name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: Formatting
        # Not `make fmt`: that rewrites in place and exits 0 either way, so it
        # can never fail a build and the result is never committed. This fails.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            echo >&2
            echo "run 'gofmt -w' on them and commit the result" >&2
            exit 1
          fi
      - run: make vet test build
      # The Pages workflow runs the same suite, so this is the earlier signal.
      # A merge result is not a branch: what this checks is the exact tree that
      # gets deployed.
      - name: Generate
        # No VTESSERA_BASE_URL secret here, so the live section renders from
        # the committed snapshot or stays absent. The site must publish whether
        # or not vtessera is reachable, so generation failing is the failure.
        run: make generate