name: Test

on:
  pull_request:
  push:
    branches: [main]
  # Scheduled as well as pushed. The published file only goes stale when the
  # deploy that rewrites it has stopped running, and a stopped deploy means no
  # push-triggered run either — a push-only check would be silent in exactly
  # the failure it exists to catch.
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: Formatting
        # Not `make fmt`: that rewrites in place and exits 0 either way, so it
        # can never fail a build and the result is never committed. This fails.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            echo >&2
            echo "run 'gofmt -w' on them and commit the result" >&2
            exit 1
          fi
      - run: make vet test build
      # The Pages workflow runs the same suite, so this is the earlier signal.
      # A merge result is not a branch: what this checks is the exact tree that
      # gets deployed.
      - name: Generate
        # No VTESSERA_BASE_URL secret here, so the live section renders from
        # the committed snapshot or stays absent. The site must publish whether
        # or not vtessera is reachable, so generation failing is the failure.
        run: make generate
      - name: The committed change feed is in sync
        # content/changes.json is committed history, and only this snapshot
        # build (no VTESSERA_BASE_URL above) is allowed to append to it: a
        # changed directory must carry its record, or the next scheduled run
        # regenerates, sees a diff, and fails for a change nobody made.
        # `git status --porcelain` rather than `git diff --quiet`: diff only
        # ever sees tracked files, so an uncommitted feed reads as clean —
        # the same trap that hid live-health.json and live-attestations.json.
        run: |
          if [ -n "$(git status --porcelain -- content/changes.json)" ]; then
            echo "content/changes.json is out of date; run 'make generate' and commit the result" >&2
            git status --porcelain -- content/changes.json >&2
            exit 1
          fi
      - name: The published directory is fresh
        # The build stamps generatedAt with its own clock, so the published
        # value only ages if nothing has been rebuilding the site. This reads
        # what is actually served, not what the workspace would produce.
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          from datetime import datetime, timezone

          url = "https://agent-ai-tool.com/agents.json"
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.load(r)
          except Exception as exc:
              print(f"cannot read {url}: {exc}", file=sys.stderr)
              sys.exit(1)

          generated = data.get("generatedAt")
          if not generated:
              print(f"{url} carries no generatedAt", file=sys.stderr)
              sys.exit(1)

          stamp = datetime.fromisoformat(generated.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - stamp).total_seconds()
          print(f"generatedAt={generated} age={age / 3600:.1f}h")
          if age > 48 * 3600:
              print(
                  f"the published directory is {age / 3600:.0f} hours old; "
                  "the Pages deploy has stopped running",
                  file=sys.stderr,
              )
              sys.exit(1)
          EOF