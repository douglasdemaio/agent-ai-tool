name: Refresh live snapshots

# Fetches vtessera's public feeds and commits the result so a build that
# cannot reach the service still has something truthful to render. Committing
# only on change keeps the history quiet and stops the Pages workflow from
# rebuilding in a loop.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Pushes to main, which requires the `test` check a bot push cannot
      # carry, so the push authenticates as the deploy key that the repository
      # ruleset lists as a bypass actor.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: Fetch snapshots
        # Skips cleanly while no base URL is configured, rather than failing
        # every day and training us to ignore this job.
        env:
          VTESSERA_BASE_URL: ${{ secrets.VTESSERA_BASE_URL }}
        run: |
          if [ -z "$VTESSERA_BASE_URL" ]; then
            echo "VTESSERA_BASE_URL is not set; nothing to refresh."
            exit 0
          fi
          go run . -refresh
      - name: Commit if changed
        run: |
          # `git status --porcelain` rather than `git diff --quiet`: diff only
          # ever sees tracked files, so a snapshot that has never been committed
          # reads as "unchanged" and is silently discarded. That is exactly what
          # happened for as long as these two files were untracked, which left
          # the offline fallback with nothing to fall back to. Porcelain reports
          # untracked files as ??, so a first snapshot commits.
          # `:(glob)` rather than a shell glob or a literal list: a shell glob
          # only matches files that already exist, so a snapshot being written
          # for the first time is missed, and a literal list misses every file
          # added after it was written. Both of those hid here once already —
          # live-health.json and live-attestations.json were added to the
          # service and to this repository together, and this job kept only
          # naming the two it was written against.
          snapshots=':(glob)content/live-*.json'
          if [ -z "$(git status --porcelain -- $snapshots)" ]; then
            echo "Snapshots unchanged."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $snapshots
          git commit -m 'chore: refresh live vtessera snapshots'
          git push
