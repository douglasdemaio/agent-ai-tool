name: Check endpoint health

# Probes every endpoint the directory advertises and commits the verdict.
#
# This is separate from the vtessera snapshot refresh because the two have
# different prerequisites: the refresh needs VTESSERA_BASE_URL and does nothing
# without it, while the health check needs no configuration and runs whatever
# entries happen to be curated. It also runs more often, because a third-party
# endpoint going down is not a once-a-day event.
#
# The check never fails. A dead endpoint is a fact to publish, not a reason to
# stop publishing: the build withholds the dead URL, names the reason, and
# restores it on the next run once the service answers again.
#
# Every step here is either a go run or plain git. Nothing is decided by
# parsing JSON in the shell, because the one job that did that failed on every
# run without a single test failing to tell anyone.

on:
  schedule:
    # Six hours. The report is treated as stale after 48, so a couple of missed
    # runs degrade to publishing endpoints unchecked rather than suppressing
    # working ones.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # This job pushes to main, and main requires the `test` status check,
      # which a bot's direct push can never carry. So the push authenticates as
      # a deploy key rather than as GITHUB_TOKEN, and that key is the bypass
      # actor in the repository ruleset that replaces branch protection.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: Probe endpoints
        run: go run . -check
      - name: Commit if the verdicts changed, or the report is going stale
        run: |
          # checkedAt moves on every run, so committing unconditionally would
          # rebuild the site six times a day to say nothing. The decision is
          # made by the program, not by this script: it is the same code that
          # probes and the same rules the staleness window uses, and it is
          # covered by tests. An earlier version of this step decided in shell
          # by parsing JSON with python3 and failed on every scheduled run for
          # two days without anyone reading the log.
          #
          # The report in the working tree was just overwritten by -check, so
          # the committed copy is restored from HEAD to compare against.
          git show HEAD:content/health.json > previous-health.json 2>/dev/null || true
          decision=$(go run . -commit-plan -previous-health-report previous-health.json)
          rm -f previous-health.json
          if [ "$decision" != "commit" ]; then
            echo "Verdicts unchanged and the report is fresh; discarding this run's timestamp."
            git checkout -- content/health.json
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/health.json
          git commit -m 'chore: record the latest endpoint health report'
          git push
